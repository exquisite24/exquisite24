<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RIA Call Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap">
<style>
:root {
  --bg: #eef2f7; --paper: #fbfcfe; --panel: #e8eff8; --card: #ffffff; --line: #c6d4e6; --ink: #15233a; --muted: #4a5b76;
  --navy: #1d3f6b; --navy-ink: #1d3f6b;
  --sell: #a4553b; --sell-soft: #f7ece6; --sell-ink: #8f4630;
  --merge: #23716d; --merge-soft: #e1efed; --merge-ink: #1d625e;
  --succ: #5a4f98; --succ-soft: #ebe9f5; --succ-ink: #4c4288;
  --rec: #3d7a48; --rec-soft: #e4f0e5; --rec-ink: #336a3d;
  --never-bg: #fbeeee; --never-ink: #9a2f2f; --never-line: #ecc4c4;
  --open-bg: #fbf4de; --open-ink: #6b5210; --open-line: #d9bf74;
  --ok-bg: #e3f1e6; --ok-ink: #2f6a3a; --ok-line: #9cc9a5;
  --script-bg: #e3f3fc; --script-line: #7cb9e0; --script-bar: #2b86c2;
  --f: "Figtree", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220; --paper: #111b2c; --panel: #172438; --card: #1b2a42; --line: #2e4161; --ink: #e4ebf6; --muted: #a6b5cc;
    --navy: #2a5590; --navy-ink: #9fc0ef;
    --sell-soft: #2a1f1c; --sell-ink: #e8a68e; --merge-soft: #152a2a; --merge-ink: #7fcdc6;
    --succ-soft: #211f36; --succ-ink: #b9b0ee; --rec-soft: #18291c; --rec-ink: #93cf9d;
    --never-bg: #33191c; --never-ink: #f0a3a3; --never-line: #5e2a2f;
    --open-bg: #352c13; --open-ink: #ecd38a; --open-line: #7a6326;
    --ok-bg: #16301d; --ok-ink: #9fd6aa; --ok-line: #2f6a3a; --script-bg: #10283a; --script-line: #2d5f82; --script-bar: #5aaee3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220; --paper: #111b2c; --panel: #172438; --card: #1b2a42; --line: #2e4161; --ink: #e4ebf6; --muted: #a6b5cc;
  --navy: #2a5590; --navy-ink: #9fc0ef;
  --sell-soft: #2a1f1c; --sell-ink: #e8a68e; --merge-soft: #152a2a; --merge-ink: #7fcdc6;
  --succ-soft: #211f36; --succ-ink: #b9b0ee; --rec-soft: #18291c; --rec-ink: #93cf9d;
  --never-bg: #33191c; --never-ink: #f0a3a3; --never-line: #5e2a2f;
  --open-bg: #352c13; --open-ink: #ecd38a; --open-line: #7a6326;
  --ok-bg: #16301d; --ok-ink: #9fd6aa; --ok-line: #2f6a3a; --script-bg: #10283a; --script-line: #2d5f82; --script-bar: #5aaee3;
  color-scheme: dark;
}
.t-owner { --c: var(--navy); --cs: var(--panel); --ci: var(--navy-ink); }
.t-sell { --c: var(--sell); --cs: var(--sell-soft); --ci: var(--sell-ink); }
.t-merge { --c: var(--merge); --cs: var(--merge-soft); --ci: var(--merge-ink); }
.t-succ { --c: var(--succ); --cs: var(--succ-soft); --ci: var(--succ-ink); }
.t-rec { --c: var(--rec); --cs: var(--rec-soft); --ci: var(--rec-ink); }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 18px; line-height: 1.4; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: grid; gap: 14px; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; }
header.top { background: var(--navy); color: #fff; border-radius: 12px; padding: 14px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 20px; }
header.top h1 { font-size: 28px; font-weight: 800; }
header.top p { opacity: .92; font-size: 16px; }
.hdr-r { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.draft { background: #fbf4de; color: #6b5210; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; font-size: 12px; padding: 2px 8px; border-radius: 5px; }
.newcall { border: 1.5px solid rgba(255,255,255,.6); background: transparent; color: #fff; border-radius: 8px; padding: 6px 12px; font-weight: 700; font-size: 15px; cursor: pointer; }

/* Progress */
.progress { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.progress li { margin: 0; }
.progress button { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 999px; padding: 5px 14px 5px 6px; font-weight: 700; font-size: 15.5px; cursor: pointer; }
.progress button .d { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--line); color: var(--ink); font-size: 14px; font-weight: 800; }
.progress button.done .d { background: var(--ok-bg); color: var(--ok-ink); }
.progress button.cur { border-color: var(--c, var(--navy)); color: var(--ink); background: var(--cs, var(--panel)); }
.progress button.cur .d { background: var(--c, var(--navy)); color: #fff; }
.progress button:disabled { opacity: .5; cursor: default; }
.trackchip { margin-left: auto; align-self: center; background: var(--c); color: #fff; font-weight: 800; border-radius: 999px; padding: 4px 12px; font-size: 15px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 16px; align-items: start; }
.main { background: var(--paper); border: 2px solid var(--c, var(--navy)); border-radius: 14px; overflow: hidden; }
.main .hd { background: var(--c, var(--navy)); color: #fff; padding: 12px 20px; }
.main .hd .eb { font-size: 13px; font-weight: 800; letter-spacing: .7px; text-transform: uppercase; opacity: .9; }
.main .hd h2 { font-size: 27px; font-weight: 800; }
.main .hd p { font-size: 16.5px; opacity: .95; margin-top: 2px; }
.main .bd { padding: 16px 20px 18px; display: grid; gap: 14px; }
.block { display: grid; gap: 8px; }
.k { font-size: 13.5px; font-weight: 800; letter-spacing: .7px; text-transform: uppercase; color: var(--ci, var(--navy-ink)); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.k .req { background: var(--c, var(--navy)); color: #fff; border-radius: 5px; padding: 0 6px; font-size: 11.5px; letter-spacing: .5px; }
.k .opt { background: var(--line); color: var(--ink); border-radius: 5px; padding: 0 6px; font-size: 11.5px; letter-spacing: .5px; }
.say { background: var(--script-bg); border: 1.5px solid var(--script-line); border-left: 6px solid var(--script-bar); border-radius: 10px; padding: 12px 16px; font-weight: 600; font-size: 20px; line-height: 1.35; display: grid; gap: 8px; }
.say span { display: block; }
.say.sm { font-size: 18px; }
.tip { font-size: 15.5px; color: var(--muted); }
.new { background: var(--open-bg); color: var(--open-ink); border: 1px dashed var(--open-line); border-radius: 5px; padding: 0 6px; font-size: 12.5px; font-weight: 800; letter-spacing: .3px; text-transform: none; }
.ok { background: var(--ok-bg); color: var(--ok-ink); border: 1px solid var(--ok-line); border-radius: 999px; padding: 0 8px; font-size: 13px; font-weight: 800; white-space: nowrap; text-transform: none; letter-spacing: 0; }
.open { background: var(--open-bg); color: var(--open-ink); border: 1px dashed var(--open-line); border-radius: 5px; padding: 0 5px; font-weight: 700; }

.opts { display: grid; gap: 8px; }
.opts.cols { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
label.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); cursor: pointer; }
label.opt:hover { border-color: var(--c, var(--navy)); }
label.opt input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--c, var(--navy)); }
label.opt:has(input:checked) { border-color: var(--c, var(--navy)); background: var(--cs, var(--panel)); }
label.opt b { display: block; }
label.opt small { display: block; color: var(--muted); font-size: 15px; font-style: italic; }

.qa { display: grid; gap: 6px; background: var(--cs, var(--panel)); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.qa .q { font-weight: 700; font-size: 18.5px; }
textarea, input[type=text] { font: inherit; font-size: 17px; width: 100%; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); min-width: 0; }
textarea { min-height: 64px; resize: vertical; }
textarea:focus-visible, input:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--c, var(--navy)); outline-offset: 1px; }
.flds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }
.fld { display: grid; gap: 3px; font-size: 15px; font-weight: 700; }
.chks { display: grid; gap: 6px; }
.chk { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; }
.chk input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--c, var(--navy)); }
.chk:has(input:checked) > span { text-decoration: line-through; color: var(--muted); }
.done-chk { border: 2px solid var(--c, var(--navy)); font-weight: 700; }

.nav { display: flex; justify-content: space-between; gap: 10px; padding-top: 4px; border-top: 1px solid var(--line); margin-top: 2px; padding-top: 14px; }
.btn { border: 0; background: var(--c, var(--navy)); color: #fff; font-weight: 800; border-radius: 9px; padding: 10px 18px; cursor: pointer; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.why { font-size: 15px; color: var(--muted); align-self: center; }
.next { background: var(--card); border: 1.5px dashed var(--c, var(--navy)); border-radius: 10px; padding: 9px 14px; }
.next b { color: var(--ci, var(--navy-ink)); }
.never { background: var(--never-bg); border: 1px solid var(--never-line); border-radius: 10px; padding: 9px 14px; font-size: 16px; }
.never b { color: var(--never-ink); }
.notetxt { width: 100%; min-height: 260px; font-size: 15px; }
.copied { font-weight: 700; color: var(--ci, var(--navy-ink)); font-size: 15px; align-self: center; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Help panel */
.help { display: grid; gap: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.help h3 { font-size: 15px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--navy-ink); }
.hbox { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; display: grid; gap: 6px; }
.hbox.trk { border-color: var(--c); background: var(--cs); }
.hbox.trk h3 { color: var(--ci); }
details { background: var(--card); border: 1px solid var(--line); border-radius: 9px; }
summary { cursor: pointer; padding: 8px 11px; font-weight: 700; font-size: 16px; list-style: none; display: flex; gap: 8px; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "+"; font-weight: 800; color: var(--ci, var(--navy-ink)); width: 12px; flex: none; }
details[open] summary::before { content: "-"; }
details .in { padding: 0 11px 11px; display: grid; gap: 8px; font-size: 16px; }
details .say { font-size: 16.5px; padding: 9px 12px; }
.switch { justify-self: start; border: 1.5px solid var(--c); background: var(--card); color: var(--ci); font-weight: 800; border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 15px; }
.rules { font-size: 15px; }
.rules ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.trb { display: grid; gap: 4px; }
.trb .say { border-style: dashed; border-color: var(--c, var(--navy)); background: var(--cs, var(--panel)); font-weight: 600; }
.trb .when { font-size: 14px; font-weight: 700; color: var(--muted); }
.cue { font-size: 16px; background: var(--paper); border-left: 0; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; }
.cue b { color: var(--ci, var(--navy-ink)); }
.say .skip { color: var(--muted); text-decoration: line-through; font-weight: 500; }
.say .skip em { text-decoration: none; display: inline-block; font-size: 14px; }
summary .tg { flex: none; align-self: center; background: var(--c, var(--navy)); color: #fff; border-radius: 5px; padding: 0 6px; font-size: 12px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; }
summary { align-items: flex-start; }
.help h3 { font-size: 17px; }
.ack { display: flex; gap: 10px; align-items: center; font-size: 16px; color: var(--muted); }
.ackt { background: var(--c, var(--navy)); color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .4px; text-transform: uppercase; border-radius: 6px; padding: 2px 8px; flex: none; }
.src { font-size: 15px; color: var(--muted); background: var(--paper); border: 1px dashed var(--line); border-radius: 8px; padding: 6px 11px; }
.src b { color: var(--ink); }
[hidden] { display: none !important; }
/* Cue cards */
.cues { display: grid; gap: 6px; }
.cuec { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; background: var(--card); border: 1.5px solid var(--line); border-left: 5px solid var(--c, var(--navy)); border-radius: 10px; padding: 8px 12px; font-size: 19px; font-weight: 700; }
.cuec .n { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--cs, var(--panel)); color: var(--ci, var(--navy-ink)); font-size: 14px; font-weight: 800; }
.cuec.ask { border-left-color: var(--ok-ink); }
details.full { background: transparent; border: 1px dashed var(--line); }
details.full summary { font-size: 14.5px; color: var(--muted); }
.modebtn { border: 1.5px solid rgba(255,255,255,.6); background: #fff; color: var(--navy); border-radius: 8px; padding: 6px 12px; font-weight: 800; font-size: 15px; cursor: pointer; }
.cuehint { background: var(--ok-bg); color: var(--ok-ink); border: 1px solid var(--ok-line); border-radius: 10px; padding: 8px 12px; font-size: 15.5px; }
/* Call map */
.map { background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 16px; display: grid; gap: 10px; }
.map h3 { font-size: 14px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--navy-ink); }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.node { border: 1.5px solid var(--line); background: var(--card); color: var(--muted); border-radius: 10px; padding: 5px 10px; font-size: 14.5px; font-weight: 700; }
.node.done { background: var(--ok-bg); color: var(--ok-ink); border-color: var(--ok-line); }
.node.cur { background: var(--c, var(--navy)); color: #fff; border-color: var(--c, var(--navy)); box-shadow: 0 0 0 3px var(--cs, var(--panel)); }
.arrow { color: var(--muted); font-weight: 800; }
.nextact { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; background: var(--cs, var(--panel)); border: 1.5px dashed var(--c, var(--navy)); border-radius: 10px; padding: 9px 12px; }
.nextact .lbl { background: var(--c, var(--navy)); color: #fff; font-weight: 800; font-size: 12.5px; letter-spacing: .4px; text-transform: uppercase; border-radius: 6px; padding: 3px 8px; }
.nextact p { font-size: 16.5px; font-weight: 600; }
.ladder { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
.rung { border: 1.5px solid var(--line); border-radius: 9px; padding: 6px 9px; font-size: 13.5px; background: var(--card); display: grid; gap: 2px; }
.rung b { font-size: 14.5px; }
.rung .bar { height: 6px; border-radius: 4px; background: var(--line); }
.rung.hit { border-color: var(--ok-line); background: var(--ok-bg); color: var(--ok-ink); }
.rung.hit .bar { background: var(--ok-ink); }
.gk { display: grid; gap: 6px; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.gk .goal { font-size: 15.5px; color: var(--ci, var(--navy-ink)); font-weight: 700; }
.pre { background: var(--open-bg); border: 1px solid var(--open-line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.pre .k { color: var(--open-ink); }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } .help { position: static; } .trackchip { margin-left: 0; } }
@media (max-width: 600px) { .flds { grid-template-columns: minmax(0, 1fr); } .say { font-size: 18px; } .main .hd h2 { font-size: 23px; } }
</style>

<div class="wrap">
  <header class="top">
    <div><h1>RIA Call Assistant</h1><p>Follow the steps in order. Read each line naturally, then pause and let them answer. Keep every fact and claim exactly as written. <b>Call map</b> shows where you are and what to do next.</p></div>
    <div class="hdr-r"><span class="draft">Based on Playbook v2</span><button class="newcall" type="button" id="newcall">Start a new call</button></div>
  </header>
  <ol class="progress" id="progress" aria-label="Call steps"></ol>
  <section class="map" id="map" aria-label="Call map and next action"></section>
  <div class="layout">
    <section class="main" id="main" aria-live="polite"></section>
    <aside class="help" id="help" aria-label="Help during the call"></aside>
  </div>
</div>

<script>

      obj: [

        { q: "\"I'm talking to other buyers.\"", say: ["That makes sense.", "Plenty of owners look at a few options.", "The difference we'd bring is what your clients get afterward.", "Worth adding us to the list?"] },
        { q: "\"I'm not ready yet.\"", say: ["Totally fair.", "Would it be useful to plan for when you are?"], go: "succ", why: "Pivot to Succession" }

      book: "Confidential call with principals (NDA first)", nda: true, tag: "RIA - Sell",

      email: { subj: "A confidential question", body: "Hi [Name], if stepping away from the practice is on your mind, I'd welcome a confidential, no-obligation conversation. As a multi-family office, your clients would land with a full team. [link] · Unsubscribe: reply \"stop\" · [address]" } },
    merge: { name: "Merge & Stay On", cls: "t-merge", sub: "Wants to keep advising for years", hear: "\"I love advising, I hate running the business.\" · \"I want to keep my clients.\" · \"I'm buried in compliance and admin.\" · \"My clients want more than I can offer.\"",

  function cue(html) { return '<p class="cue">' + html + "</p>"; }

  }
  function whoBlock() { return '<div class="block"><span class="k">Who is on the phone? <span class="req">Required</span></span><div class="opts">' +
      radio("who", "owner", "A firm owner", "Founder, principal or majority owner of an RIA", "t-owner") +
      radio("who", "advisor", "An individual advisor", "Works at someone else's firm → Recruit only", "t-rec") +
      radio("who", "unsure", "Not sure yet", "GHL and the lead source don't say", "t-owner") + "</div></div>"; }
  function unsureBlock() { return '<div class="block"><span class="k">Ask early</span>' + say(["Quick question so I don't waste your time:", "are you the owner of the practice, or part of a larger team?"]) + ansBox("a1", "Their answer") + cue("Their answer tells you which to pick above.") + "</div>"; }
  function advisorNote() { return '<p class="next"><b>Recruit track.</b> Never pitch "sell your book" or succession to someone who doesn\'t own the firm. Next, go straight to the Recruit pitch.</p>'; }
  function viewGate() {
    var h = head("Step 2 · Gatekeeper", "Get past the gatekeeper", "Short, purpose, redirect, polite. One or two sentences, then ask for [Prospect Name] again.");
    h += '<div class="bd">';
      h += '<div class="block"><span class="k">Your goal: get connected</span>' + cue("<b>Short, purpose, redirect, polite.</b> One or two sentences, then ask for [Prospect Name] again. Never mention selling, merging, recruiting or numbers to a gatekeeper.") +
        '<div class="flds">' + field("id_name", "Gatekeeper's name", "Use it on the call") + field("id_rel", "Their role", "e.g., receptionist, assistant") + "</div></div>";
      h += '<div class="block"><span class="k">What did the gatekeeper say?</span><div class="opts cols">' + GK.map(function (g) {
        return '<label class="opt"><input type="radio" name="r_gk" value="' + g.id + '"' + (S.r.r_gk === g.id ? " checked" : "") + "><span><b>" + esc(g.q) + "</b></span></label>"; }).join("") + "</div></div>";
      var g = GK.filter(function (x) { return x.id === S.r.r_gk; })[0];
      if (g) h += '<div class="gk"><span class="goal">Goal: ' + esc(g.goal) + "</span>" + sayCue(g.kw, g.say) + "</div>";
      h += choice("r_avail", "Where did it land?", [["on", "Transferred: they're coming on the line"], ["cb", "Got a callback time"], ["info", "Got a direct line or email"], ["na", "Not available, nothing else"], ["dnc", "Asked to be removed"], ["new", "This person is an advisor or owner and open to talk"]]);
      if (S.r.r_avail === "cb" || S.r.r_avail === "info" || S.r.r_avail === "na") h += '<div class="flds">' + field("id_best", S.r.r_avail === "info" ? "Direct line or email" : "Callback day and time (their time zone)", "Write it exactly") + "</div>";
      if (S.r.r_avail === "dnc") h += '<p class="never"><b>Mark Do Not Call in GHL right away.</b> Don\'t call this number again.</p>';
    
    if (S.r.r_avail === "on") h += ack("When [Prospect Name] comes on, greet them, confirm it's them, then continue.");
    if (S.r.r_avail === "new") h += '<div class="block"><span class="k">New contact: the person on the phone</span><div class="flds">' + field("nc_name", "Their name", "First and last name") + field("nc_firm", "Their firm", "Firm name") + field("nc_phone", "Best number", "Confirm it out loud") + field("nc_email", "Best email", "Optional") + "</div>" + cue("Find out if they own the firm, then continue with them. <b>Never</b> share anything about the person you were calling.") + "</div>";
    if (S.r.r_avail === "on" || S.r.r_avail === "new") { h += whoBlock(); if (S.who === "unsure") h += unsureBlock(); if (S.who === "advisor") h += advisorNote(); }
    h += nextBlock() + "</div>";

  }

  function viewPitch() {

    h += choice("r_pitch", "Their answer", [["yes", "Yes / open to it"], ["push", "Hesitant or pushing back"], ["no", "Not interested"], ["dnc", "Asked not to be called again"]]);

  function viewAsk() {
    var t = T(), n = S.who === "owner" ? 5 : 3, sec = { sell: "5", merge: "6", succ: "7", rec: "8" }[tkey()];
    var h = head("Step " + n + " · " + t.name, "Track questions", "These questions are only for the " + t.name + " track. Ask every one and type their answers.");
    h += '<div class="bd">' + src("Section " + sec + ", Questions to ask. Different for each track, so they come after you pick the track and pitch it.");

  }
  function viewWrap() {
    var t = T(), n = S.who === "owner" ? 6 : 4;

    h += '<div class="bd">' + src("Section 10, Handoff, NDA & GHL.");
    h += '<p class="next"><b>Book:</b> ' + esc(t.book) + (tkey() === "rec" ? ' <span class="open">Ken to name</span>' : "") + '</p><p class="tip">Stop when they want to discuss numbers, clients or terms. Book the principal call.</p>';

  function chk(id, html) { return '<label class="chk"><input type="checkbox" data-c="' + id + '"' + (S.checks[id] ? " checked" : "") + "><span>" + html + "</span></label>"; }

  function noteText() {
    var t = T(), end = S.step === "end" ? S.outcome : null;
    var L = [];
    if (end) L.push("Outcome: " + end);
    if (t) L.push("Track: " + t.tag);
    L.push("Contact: " + ({ owner: "Firm owner", advisor: "Individual advisor", unsure: "Not confirmed" }[S.who] || "Not confirmed"));
    if (t && !end) L.push("Next step: " + t.book);
    if (t && !end) BOOK_FIELDS.forEach(function (f) { L.push(f.label + ": " + (S.book[f.id] || "")); });
    if (t && t.nda && !end) L.push("NDA needed before the principal meeting: Yes");
    if (S.ans.nc_name || S.ans.nc_firm) L.push("New contact (not the original prospect): " + (S.ans.nc_name || "") + ", " + (S.ans.nc_firm || "") + ", " + (S.ans.nc_phone || "") + (S.ans.nc_email ? ", " + S.ans.nc_email : ""));
    if (S.r.r_isit === "wrong") L.push("Original number was a wrong number.");
    if (S.ans.id_name || S.ans.id_rel || S.ans.id_best) L.push("Gatekeeper: " + (S.ans.id_name || "") + " (" + (S.ans.id_rel || "") + "). Reach prospect: " + (S.ans.id_best || ""));
    if (S.r.r_gk) { var gg = GK.filter(function (x) { return x.id === S.r.r_gk; })[0]; if (gg) L.push("Gatekeeper said: " + gg.q.replace(/\\"/g, '"')); }
    if (S.r.r_avail) L.push("Gatekeeper result: " + ({ on: "Transferred", cb: "Callback time", info: "Direct line or email", na: "Not available", dnc: "Asked to be removed (DNC)", new: "New contact" }[S.r.r_avail] || ""));
    if (S.checks.vm) L.push("Voicemail left: Yes");
    if (S.checks.em) L.push("Email sent: Yes");
    if (S.r.r_time === "busy") L.push("Busy. Call back: " + (S.ans.cb_time || ""));
    L.push("", "What they said:");
    if (S.ans.a1) L.push("- Owner or part of a team? → " + S.ans.a1);
    if (S.who === "owner") {
      if (S.ans.route) L.push("- " + ROUTING + " → " + S.ans.route);
      FOLLOWUPS.forEach(function (q, i) { if (S.ans["fu" + i]) L.push("- " + q + " → " + S.ans["fu" + i]); });
    }
    Object.keys(TRACKS).forEach(function (k) {
      TRACKS[k].ask.forEach(function (q, i) { var a = S.ans[k + "q" + i]; if (a || (k === tkey() && !end)) L.push("- " + q + " → " + (a || "")); });
    });
    if (S.r.r_pitch) L.push("- Response to the pitch: " + { yes: "Yes / open to it", push: "Hesitant or pushing back", no: "Not interested", dnc: "Asked not to be called again" }[S.r.r_pitch] + (S.ans.pitch_note ? " → " + S.ans.pitch_note : ""));
    Object.keys(TRACKS).forEach(function (k) { TRACKS[k].obj.forEach(function (o, i) { var a = S.ans["ob_" + k + i]; if (a) L.push("- Objection " + o.q + " → " + a); }); });
    ABOUT_US.forEach(function (q, i) { var a = S.ans["ab" + i]; if (a) L.push("- Asked " + q.q + " → " + a); });
    if (S.extra) L.push("- Other notes: " + S.extra);
    return L.join("\n");
  }

  function renderProgress() {

  function nextAction() {
    var t = T(), r = S.r;
    if (S.step === "end") return "Log the outcome in GHL, paste the note, then start your next call.";
    if (S.step === "greet") {
      if (!r.r_isit) return "Check the GHL name and lead source, then greet. Ask for [Prospect Name] by first name.";
      if (r.r_isit === "vm") return "Leave a voicemail under 20 seconds (name and number twice), send the track email, then log it.";
      if (r.r_isit === "wrong") return "Ask if they're an advisor or owner. If not, end politely and mark the number wrong.";
      if (r.r_isit === "no") return "A gatekeeper answered. Go to the Gatekeeper step.";
      if (!S.who) return "Confirm who is on the phone: owner or individual advisor?";
      if (S.who === "unsure") return "Ask: \"Are you the owner of the practice, or part of a larger team?\"";
      return S.who === "advisor" ? "Go to the Recruit pitch." : "Go to the opening.";
    }
    if (S.step === "gate") {
      if (!r.r_gk) return "Ask for [Prospect Name] by first name. Pick what the gatekeeper said to see your answer.";
      if (!r.r_avail) return "Give your answer, then redirect: ask if [Prospect Name] is available. Aim for a transfer, a time, a direct line or an email.";
      if (r.r_avail === "dnc") return "Thank them and mark Do Not Call in GHL right away.";
      if (r.r_avail === "cb" || r.r_avail === "info" || r.r_avail === "na") return "Write down what you got, thank the gatekeeper by name, then end the call and log it.";
      if (!S.who) return "Confirm who is on the phone: owner or individual advisor?";
      return S.who === "advisor" ? "Go to the Recruit pitch." : "Go to the opening.";
    }
    if (S.step === "open") return r.r_time === "busy" ? "Agree a specific callback time in their time zone, then end the call." : "Say the opening, then ask \"Do you have two minutes?\"";
    if (S.step === "route") return S.track ? "Go to the pitch for the track you picked." : "Ask the five-year question. Listen for the track (sell, merge, succession).";
    if (S.step === "pitch") {
      if (r.r_pitch === "push") return "Tap their objection on the right. Acknowledge, answer briefly, end with a question.";
      if (r.r_pitch === "no") return "Ask one question about what they mean. If it's still no, end politely and log it.";
      if (r.r_pitch === "dnc") return "Stop. Thank them and mark Do Not Call in GHL right away.";
      return "Give the " + (t ? t.name : "") + " pitch. Stop at the question and let them answer.";
    }
    if (S.step === "ask") return "Ask each " + (t ? t.name : "") + " question. Note their fear and who else decides.";
    if (S.step === "wrap") return "Offer two specific times in their time zone. Confirm email. Create the Opportunity and tag it.";
    return "";
  }
  function renderMap() {
    var st = [{ id: "pre", label: "Pre-call check" }].concat(steps()).concat([{ id: "log", label: "Log in GHL" }]);
    var cur = S.step === "end" ? st.length - 1 : st.findIndex(function (s) { return s.id === S.step; });
    var preDone = S.checks.pc_name && S.checks.pc_type && S.checks.pc_time && S.checks.pc_real;
    var flow = st.map(function (s, i) { var c = s.id === "pre" ? (preDone ? "done" : "") : (i < cur ? "done" : i === cur ? "cur" : ""); return '<span class="node ' + c + '">' + (s.id === "pre" && preDone ? "✓ " : "") + esc(s.label) + "</span>"; }).join('<span class="arrow" aria-hidden="true">→</span>');
    var r = S.r, booked = S.step === "wrap" || (S.step === "end" && false);
    var hits = {
      book: S.step === "wrap" && !!(S.book.date && S.book.time),
      talk: S.r.r_isit === "yes" || r.r_avail === "on" || r.r_avail === "new",
      time: r.r_avail === "cb" || r.r_time === "busy",
      info: r.r_avail === "info",
      vm: !!S.checks.vm || !!S.checks.em
    };
    var rungs = [["book", "Meeting booked", "Best outcome"], ["talk", "Reached the owner", "Transfer or direct"], ["time", "Callback time", "Specific day and time"], ["info", "Direct line or email", "A way past the desk"], ["vm", "Voicemail or email", "A complete touch"]];
    $("map").className = "map " + cls();
    $("map").innerHTML = '<h3>Call map</h3><div class="flow">' + flow + '</div><div class="nextact"><span class="lbl">Do next</span><p>' + esc(nextAction()) + '</p></div>' +
      '<h3>Leave with something</h3><div class="ladder">' + rungs.map(function (x) { return '<div class="rung' + (hits[x[0]] ? " hit" : "") + '"><b>' + (hits[x[0]] ? "✓ " : "") + esc(x[1]) + "</b><span>" + esc(x[2]) + '</span><span class="bar"></span></div>'; }).join("") + "</div>";
  }
  function render() {
    var v = { end: viewEnd, greet: viewGreet, gate: viewGate, open: viewOpen, route: viewRoute, pitch: viewPitch, ask: viewAsk, wrap: viewWrap }[S.step];
    $("main").className = "main " + cls();
    $("main").innerHTML = v();
    renderProgress(); renderHelp(); renderMap();
  }
  function go(id) { if (!canGo(id)) return; S.step = id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

  document.addEventListener("click", function (e) {
    if (e.target.closest("[data-end]")) { S.outcome = deadEnd(); S.endFrom = S.step; S.step = "end"; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    if (e.target.closest("[data-new]")) { fresh(); OPEN = {}; render(); window.scrollTo({ top: 0 }); return; }
    var b = e.target.closest("[data-go]"); if (b && !b.disabled) { go(b.getAttribute("data-go")); return; }
    var sw = e.target.closest("[data-switch]");
    if (sw) { S.track = sw.getAttribute("data-switch"); S.pitched = false; S.step = "pitch"; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    if (e.target.id === "copy") {
      var ta = $("notetxt"), ok = $("copied"), txt = noteText();
      var fallback = function () { ta.focus(); ta.select(); ok.textContent = "Press Ctrl+C (or Cmd+C) to copy."; };
      try { navigator.clipboard.writeText(txt).then(function () { ok.textContent = "Copied. Paste it into GHL."; }, fallback); } catch (err) { fallback(); }
    }
    if (e.target.id === "newcall") { fresh(); OPEN = {}; render(); window.scrollTo({ top: 0 }); }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.type === "radio" && t.name.indexOf("r_") === 0) { S.r[t.name] = t.value; render(); return; }
    if (t.type === "radio") {
      S[t.name] = t.value;
      if (t.name === "who") { S.track = null; S.pitched = false; }
      if (t.name === "track" && t.value === "none") { /* stays on this step */ }
      if (t.name === "track") S.pitched = false;
      if (t.name === "track" && t.value === "none") S.track = "none";
      render(); return;
    }
    if (t.id === "pitched") { S.pitched = t.checked; render(); return; }
    var c = t.getAttribute("data-c"); if (c) { S.checks[c] = t.checked; renderMap(); }
  });
  document.addEventListener("input", function (e) {
    var t = e.target, a = t.getAttribute("data-a"), b = t.getAttribute("data-b");
    if (a) S.ans[a] = t.value;
    if (b) { S.book[b] = t.value; var nt = $("notetxt"); if (nt) nt.value = noteText(); renderMap(); }
    if (t.getAttribute("data-x")) S.extra = t.value;
  });
  // A track value of "none" is not a real track.
  var _T = T; T = function () { return S.track === "none" && S.who === "owner" ? null : _T(); };
  render();
})();
</script>
